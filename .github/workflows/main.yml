name: CI - Validação do Site

# Roda em cada commit (push) e em cada pull request
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validar-site:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do commit
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Instala dependências (se houver)
      - name: Instalar dependências
        run: npm install

      # 4. Valida se o HTML não está quebrado
      - name: Validar HTML
        run: npm test

      # 5. Notifica o status do commit no GitHub
      - name: Notificar status do commit
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = context.payload.check_run ? 'completed' : 'success';
            const conclusion = (steps && steps['validar-site'].outcome === 'success')
              ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: conclusion === 'success' ? 'success' : 'failure',
              context: 'CI / Validação do Site',
              description: conclusion === 'success'
                ? 'HTML válido - código não quebrado'
                : 'Falha na validação - verifique os logs'
            });
